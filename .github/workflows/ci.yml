name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Annulation des runs superposés sur les PR uniquement : couper un run de `main` en
# cours laisserait l'index multi-arch à moitié assemblé sur GHCR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  server:
    name: Serveur (lint + tests)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Installer uv
        # Tag exact : astral-sh ne publie pas de tag majeur flottant (pas de v10)
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: "server/uv.lock"

      - name: Installer les dépendances (uv sync)
        working-directory: server
        run: uv sync

      - name: Lint (ruff check)
        working-directory: server
        run: uv run ruff check .

      - name: Vérifier le formatage (ruff format)
        working-directory: server
        run: uv run ruff format --check .

      - name: Tests (pytest)
        working-directory: server
        run: uv run pytest -q

  extension:
    name: Extension (build + tests)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Installer Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Installer les dépendances
        working-directory: extension
        # npm ci nécessite un package-lock.json ; fallback sur npm install s'il est absent
        # (ex: dépôt fraîchement scaffoldé sans lockfile committé).
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Vérification TypeScript (compile)
        working-directory: extension
        run: npm run compile

      - name: Tests
        working-directory: extension
        run: npm run test --if-present

      - name: Build
        working-directory: extension
        run: npm run build

      - name: Empaquetage (zip publié par le serveur)
        working-directory: extension
        run: npm run zip

      - name: Upload de l'artefact extension
        uses: actions/upload-artifact@v7
        with:
          name: extension-build
          path: extension/.output
          if-no-files-found: error
          # .output est un dossier caché : sans ce flag, upload-artifact n'y voit aucun fichier
          include-hidden-files: true

  image:
    name: Image ${{ matrix.arch }} (build + validation)
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      # Une arch qui casse ne doit pas masquer le résultat de l'autre.
      fail-fast: false
      matrix:
        include:
          # Runners ARM natifs, gratuits sur dépôt public : ~10x plus rapide que QEMU,
          # et le seul moyen réaliste de faire tourner `npm ci` et un build ffmpeg.
          - arch: amd64
            runner: ubuntu-latest
            platform: linux/amd64
            has_fallback_check: true
          - arch: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
            has_fallback_check: false
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configurer Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build de l'image serveur avec l'extension (chemin de production)
        # Reproduit `additional_contexts` de docker-compose.yml : l'extension est buildée
        # dans l'image et servie sur /extension. `load: true` rend l'image disponible au
        # démon local pour les assertions ci-dessous — possible parce que le runner est
        # natif de la plateforme buildée.
        uses: docker/build-push-action@v7
        with:
          context: server
          build-contexts: |
            extension=extension
          platforms: ${{ matrix.platform }}
          load: true
          tags: ez-dl-server:ci
          # Cache séparé par arch : les deux builds n'ont aucune couche en commun.
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
          provenance: false

      - name: Vérifier que l'extension est bien embarquée
        run: |
          docker run --rm --entrypoint sh ez-dl-server:ci \
            -c 'test -s /app/extension-dist/ez-dl-extension.zip && test -s /app/extension-dist/extension-version.txt'

      - name: Vérifier que l'entrypoint abandonne les privilèges
        # Le conteneur démarre root pour aligner PUID/PGID puis droppe : rien
        # d'applicatif ne doit tourner en root (cf. SECURITY.md).
        run: |
          uid="$(docker run --rm -e PUID=1027 -e PGID=100 --entrypoint /usr/local/bin/docker-entrypoint.sh \
            ez-dl-server:ci id -u)"
          test "$uid" = "1027"

      - name: Build de l'image serveur sans l'extension (repli dégradé)
        if: matrix.has_fallback_check
        working-directory: server
        # Un `docker build` nu doit rester possible : le serveur démarre, seule la
        # distribution de l'extension est indisponible.
        # --no-cache-filter : sans lui, BuildKit réutilise la couche `extension-zip` du build
        # précédent et l'image de repli embarquerait l'extension — le test ne validerait rien.
        run: docker build --no-cache-filter extension-zip -t ez-dl-server:ci-noext .

      - name: Vérifier que le repli produit une image sans artefact
        if: matrix.has_fallback_check
        run: |
          test -z "$(docker run --rm --entrypoint sh ez-dl-server:ci-noext -c 'ls -A /app/extension-dist/')"

      - name: Nom d'image en minuscules
        # GHCR refuse les majuscules ; github.repository peut en contenir (CorentinGC/ez-dl).
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Connexion à GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push par digest
        # Aucun tag ici : chaque arch pousse un manifeste anonyme, que le job `merge`
        # assemble en un index unique. Le cache du build ci-dessus est réutilisé, donc
        # cette étape ne reconstruit rien.
        # provenance: false — l'attestation ajoute au manifeste un descripteur qui fait
        # apparaître un « unknown/unknown » dans l'UI GHCR et brouille le push-by-digest.
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: push
        uses: docker/build-push-action@v7
        with:
          context: server
          build-contexts: |
            extension=extension
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ steps.image.outputs.name }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.arch }}
          provenance: false

      - name: Exporter le digest
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.push.outputs.digest }}

      - name: Upload du digest
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Index multi-arch (GHCR)
    runs-on: ubuntu-latest
    # Publie uniquement un main vert : lint + tests + validation des deux images d'abord.
    needs: [server, extension, image]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Récupérer les digests
        uses: actions/download-artifact@v7
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Configurer Buildx
        uses: docker/setup-buildx-action@v4

      - name: Nom d'image en minuscules
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Calculer les tags
        # `main` publie le canal instable. `latest` n'est plus posé ici : il ne suit plus
        # chaque commit vert mais uniquement les tags git semver (release.yml) — un
        # déploiement sur `latest` ne doit bouger qu'aux versions publiées.
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=edge
            type=sha,prefix=main-,format=short

      - name: Connexion à GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Assembler l'index et poser les tags
        working-directory: /tmp/digests
        run: |
          # Le découpage en mots est voulu : chaque tag et chaque digest doit devenir
          # un argument distinct.
          # shellcheck disable=SC2046
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ steps.image.outputs.name }}@sha256:%s ' *)

      - name: Vérifier l'index publié
        run: docker buildx imagetools inspect ${{ steps.image.outputs.name }}:edge

      - name: Vérifier que le paquet reste tirable anonymement
        # Le paquet GHCR redevient privé au moindre changement de visibilité côté GitHub :
        # sans ce test, la voie « facile » casserait silencieusement pour tous les
        # utilisateurs, et seule la CI (authentifiée) continuerait de fonctionner.
        run: |
          docker logout ghcr.io
          docker pull ${{ steps.image.outputs.name }}:edge
