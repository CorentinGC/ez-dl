name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  server:
    name: Serveur (lint + tests)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Installer uv
        # Tag exact : astral-sh ne publie pas de tag majeur flottant (pas de v10)
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: "server/uv.lock"

      - name: Installer les dépendances (uv sync)
        working-directory: server
        run: uv sync

      - name: Lint (ruff check)
        working-directory: server
        run: uv run ruff check .

      - name: Vérifier le formatage (ruff format)
        working-directory: server
        run: uv run ruff format --check .

      - name: Tests (pytest)
        working-directory: server
        run: uv run pytest -q

  extension:
    name: Extension (build + tests)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Installer Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Installer les dépendances
        working-directory: extension
        # npm ci nécessite un package-lock.json ; fallback sur npm install s'il est absent
        # (ex: dépôt fraîchement scaffoldé sans lockfile committé).
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Vérification TypeScript (compile)
        working-directory: extension
        run: npm run compile

      - name: Tests
        working-directory: extension
        run: npm run test --if-present

      - name: Build
        working-directory: extension
        run: npm run build

      - name: Empaquetage (zip publié par le serveur)
        working-directory: extension
        run: npm run zip

      - name: Upload de l'artefact extension
        uses: actions/upload-artifact@v7
        with:
          name: extension-build
          path: extension/.output
          if-no-files-found: error
          # .output est un dossier caché : sans ce flag, upload-artifact n'y voit aucun fichier
          include-hidden-files: true

  docker:
    name: Docker (validation build image)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build de l'image serveur avec l'extension (chemin de production)
        working-directory: server
        # Reproduit `additional_contexts` de docker-compose.yml : l'extension est buildée
        # dans l'image et servie sur /extension.
        run: docker build --build-context extension=../extension -t ez-dl-server:ci .

      - name: Vérifier que l'extension est bien embarquée
        run: |
          docker run --rm --entrypoint sh ez-dl-server:ci \
            -c 'test -s /app/extension-dist/ez-dl-extension.zip && test -s /app/extension-dist/extension-version.txt'

      - name: Build de l'image serveur sans l'extension (repli dégradé)
        working-directory: server
        # Un `docker build` nu doit rester possible : le serveur démarre, seule la
        # distribution de l'extension est indisponible.
        # --no-cache-filter : sans lui, BuildKit réutilise la couche `extension-zip` du build
        # précédent et l'image de repli embarquerait l'extension — le test ne validerait rien.
        run: docker build --no-cache-filter extension-zip -t ez-dl-server:ci-noext .

      - name: Vérifier que le repli produit une image sans artefact
        run: |
          test -z "$(docker run --rm --entrypoint sh ez-dl-server:ci-noext -c 'ls -A /app/extension-dist/')"

  publish:
    name: Publication de l'image (GHCR)
    runs-on: ubuntu-latest
    # Publie uniquement un main vert : lint + tests + validation du build d'image d'abord.
    needs: [server, extension, docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Nom d'image en minuscules
        # GHCR refuse les majuscules ; github.repository peut en contenir (CorentinGC/ez-dl).
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Configurer Buildx
        uses: docker/setup-buildx-action@v4

      - name: Connexion à GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build et push (latest + sha)
        # Même chemin de production que le job docker : l'extension est buildée dans
        # l'image (additional_contexts de docker-compose.yml). C'est cette image que
        # tire watchtower quand le profil compose `autoupdate` est actif.
        uses: docker/build-push-action@v7
        with:
          context: server
          build-contexts: |
            extension=extension
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
