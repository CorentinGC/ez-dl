name: Image

# Workflow réutilisable : build, validation et publication de l'image serveur.
# Appelé par ci.yml (canal `edge` sur main) et par release.yml (tags semver + `latest`).
# Il n'existe pas d'ancre YAML dans GitHub Actions : sans cette factorisation, les deux
# workflows dupliqueraient une centaine de lignes qui divergeraient au premier correctif.
on:
  workflow_call:
    inputs:
      should_push:
        description: Pousser l'image sur GHCR (sinon build + validation seulement)
        type: boolean
        default: false
      tags:
        description: Configuration `tags` de docker/metadata-action, une par ligne
        type: string
        default: ""
      ref:
        description: >-
          Ref à builder. Indispensable pour une release automatique : le commit de bump
          de version est créé PENDANT le run, donc après le commit qui a déclenché le
          workflow — builder ce dernier publierait une image annonçant l'ancienne version.
        type: string
        default: ""

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      # Une arch qui casse ne doit pas masquer le résultat de l'autre.
      fail-fast: false
      matrix:
        include:
          # Runners ARM natifs, gratuits sur dépôt public : pas de QEMU, donc pas de
          # `npm ci` ni de build d'image émulés (plusieurs minutes gagnées par run).
          - arch: amd64
            runner: ubuntu-latest
            platform: linux/amd64
            has_fallback_check: true
          - arch: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
            has_fallback_check: false
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Configurer Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build de l'image serveur avec l'extension (chemin de production)
        # Reproduit `additional_contexts` de docker-compose.yml : l'extension est buildée
        # dans l'image et servie sur /extension. `load: true` rend l'image disponible au
        # démon local pour les assertions ci-dessous — possible parce que le runner est
        # natif de la plateforme buildée.
        uses: docker/build-push-action@v7
        with:
          context: server
          build-contexts: |
            extension=extension
          platforms: ${{ matrix.platform }}
          load: true
          tags: ez-dl-server:ci
          # Cache séparé par arch : les deux builds n'ont aucune couche en commun.
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
          provenance: false

      - name: Vérifier que l'extension est bien embarquée
        run: |
          docker run --rm --entrypoint sh ez-dl-server:ci \
            -c 'test -s /app/extension-dist/ez-dl-extension.zip && test -s /app/extension-dist/extension-version.txt'

      - name: Vérifier que l'entrypoint abandonne les privilèges
        # Le conteneur démarre root pour aligner PUID/PGID puis droppe : rien
        # d'applicatif ne doit tourner en root (cf. SECURITY.md).
        run: |
          # tail -n1 : l'entrypoint journalise sur stderr, mais la commande exécutée
          # reste maîtresse de stdout — on ne dépend pas du silence de l'entrypoint.
          uid="$(docker run --rm -e PUID=1027 -e PGID=100 ez-dl-server:ci id -u | tail -n1)"
          test "$uid" = "1027"

      - name: Build de l'image serveur sans l'extension (repli dégradé)
        if: matrix.has_fallback_check
        working-directory: server
        # Un `docker build` nu doit rester possible : le serveur démarre, seule la
        # distribution de l'extension est indisponible.
        # --no-cache-filter : sans lui, BuildKit réutilise la couche `extension-zip` du build
        # précédent et l'image de repli embarquerait l'extension — le test ne validerait rien.
        run: docker build --no-cache-filter extension-zip -t ez-dl-server:ci-noext .

      - name: Vérifier que le repli produit une image sans artefact
        if: matrix.has_fallback_check
        run: |
          test -z "$(docker run --rm --entrypoint sh ez-dl-server:ci-noext -c 'ls -A /app/extension-dist/')"

      - name: Nom d'image en minuscules
        # GHCR refuse les majuscules ; github.repository peut en contenir (CorentinGC/ez-dl).
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Connexion à GHCR
        if: inputs.should_push
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push par digest
        # Aucun tag ici : chaque arch pousse un manifeste anonyme, que le job `merge`
        # assemble en un index unique. Le cache du build ci-dessus est réutilisé, donc
        # cette étape ne reconstruit rien.
        # provenance: false — l'attestation ajoute au manifeste un descripteur qui fait
        # apparaître un « unknown/unknown » dans l'UI GHCR et brouille le push par digest.
        if: inputs.should_push
        id: push
        uses: docker/build-push-action@v7
        with:
          context: server
          build-contexts: |
            extension=extension
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ steps.image.outputs.name }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.arch }}
          provenance: false

      - name: Exporter le digest
        if: inputs.should_push
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.push.outputs.digest }}

      - name: Upload du digest
        if: inputs.should_push
        uses: actions/upload-artifact@v7
        with:
          # Préfixé par la ref : ci.yml appelle ce workflow deux fois dans le même run
          # (edge puis release). Des noms identiques mêlaient les digests des deux builds et
          # l'index de la release pointait sur l'image edge (v0.1.2 annonçait 0.1.1).
          name: digests-${{ inputs.ref || 'trigger' }}-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Index multi-arch (GHCR)
    runs-on: ubuntu-latest
    needs: [build]
    if: inputs.should_push
    permissions:
      contents: read
      packages: write
    steps:
      - name: Récupérer les digests
        uses: actions/download-artifact@v7
        with:
          path: /tmp/digests
          pattern: digests-${{ inputs.ref || 'trigger' }}-*
          merge-multiple: true

      - name: Configurer Buildx
        uses: docker/setup-buildx-action@v4

      - name: Nom d'image en minuscules
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Calculer les tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
          tags: ${{ inputs.tags }}

      - name: Connexion à GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Vérifier que des tags ont été calculés
        # Sans tag, `imagetools create` échoue sur une ligne de commande tronquée et le
        # message ne dit rien de la cause. Le cas s'est produit : metadata-action tire la
        # version de github.ref, qui n'est pas le tag sur un appel workflow_call.
        run: |
          count="$(jq -r '.tags | length' <<< "$DOCKER_METADATA_OUTPUT_JSON")"
          if [ "$count" -eq 0 ]; then
            echo "::error::metadata-action n'a calculé aucun tag : vérifier l'entrée tags du workflow appelant." >&2
            exit 1
          fi

      - name: Assembler l'index et poser les tags
        working-directory: /tmp/digests
        run: |
          # Le découpage en mots est voulu : chaque tag et chaque digest doit devenir
          # un argument distinct.
          # shellcheck disable=SC2046
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ steps.image.outputs.name }}@sha256:%s ' *)

      - name: Vérifier l'index publié
        # Deux manifestes attendus : linux/amd64 et linux/arm64. Un index à une seule
        # entrée signifie qu'une arch a échoué sans faire échouer la publication.
        run: |
          primary="$(jq -cr '.tags[0]' <<< "$DOCKER_METADATA_OUTPUT_JSON")"
          echo "primary=$primary" >> "$GITHUB_ENV"
          docker buildx imagetools inspect "$primary" --format '{{json .Manifest}}' \
            | jq -e '[.manifests[] | select(.platform.os == "linux") | .platform.architecture]
                     | sort == ["amd64", "arm64"]'

      - name: Vérifier que l'image reste tirable anonymement
        # Le paquet GHCR redevient privé au moindre changement de visibilité côté GitHub :
        # sans ce test, la voie « facile » casserait silencieusement pour tous les
        # utilisateurs, et seule la CI (authentifiée) continuerait de fonctionner.
        run: |
          docker logout ghcr.io
          docker pull "$primary"
