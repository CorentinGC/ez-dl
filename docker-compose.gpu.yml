# Override GPU NVIDIA pour ez-dl — active l'encodage matériel (h264_nvenc/hevc_nvenc).
#
# Usage :
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d --build
#   (--build nécessaire au premier lancement : le build arg FFMPEG_VARIANT ci-dessous
#   change l'origine de ffmpeg, docker compose ne reconstruit pas automatiquement une
#   image déjà buildée avec la variante "debian" par défaut)
#
# Prérequis sur l'hôte :
#   - Pilote NVIDIA installé + nvidia-container-toolkit configuré pour Docker
#     (voir https://docs.nvidia.com/datacenter/cloud-native/container-toolkit/latest/install-guide.html)
#   - `docker run --rm --gpus all nvidia/cuda:12.6.0-base-ubuntu24.04 nvidia-smi` doit fonctionner
#   - Plateforme amd64 obligatoire : le binaire ffmpeg NVENC (BtbN linux64-gpl) n'est pas
#     publié pour arm64 (voir server/Dockerfile, stage `ffmpeg-nvenc`).
#
# Le ffmpeg installé par défaut dans server/Dockerfile est le paquet Debian (apt), qui
# n'embarque PAS le support NVENC (dépendances non-libres exclues des dépôts Debian). Ce
# fichier positionne le build arg FFMPEG_VARIANT=nvenc pour que l'image serveur embarque à
# la place le binaire statique BtbN/FFmpeg-Builds (variante linux64-gpl, self-contained,
# NVENC inclus) — voir server/Dockerfile pour le détail des stages.

services:
  server:
    build:
      args:
        FFMPEG_VARIANT: nvenc

    environment:
      NVIDIA_VISIBLE_DEVICES: all
      # `video` est requis en plus de `compute`/`utility` : c'est la capability qui expose
      # libnvidia-encode (NVENC) dans le conteneur via nvidia-container-toolkit. Sans elle,
      # ffmpeg peut détecter l'encodeur nvenc mais échoue à l'exécution (init NVENC impossible).
      NVIDIA_DRIVER_CAPABILITIES: compute,video,utility

    # Méthode recommandée (Docker Compose v2 + nvidia-container-toolkit en mode CDI/legacy) :
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

    # Alternative pour un moteur Docker plus ancien ne supportant pas `deploy.resources`
    # avec `docker compose up` (ex: Compose v1, ou runtime nvidia enregistré globalement) :
    # décommentez la ligne suivante et supprimez le bloc `deploy:` ci-dessus.
    # runtime: nvidia
