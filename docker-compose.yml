# Stack Docker de ez-dl (serveur uniquement — l'extension Chrome n'est pas conteneurisée).
#
# Démarrage :
#   1. Copier ce fichier tel quel ; créer si possible un `.env` à côté avec
#      EZDL_PASSWORD=<mot de passe fort> (sinon un mot de passe est généré à chaque
#      démarrage et affiché dans `docker compose logs`)
#   2. Adapter les volumes médias ci-dessous (chemins réels de votre NAS/disque)
#   3. `docker compose up -d`
#
# GPU NVIDIA (encodage matériel) : voir docker-compose.gpu.yml.

services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
      additional_contexts:
        # Sources de l'extension Chrome, buildées en zip pendant la construction de l'image
        # et publiées ensuite sur http://<serveur>:<port>/extension. Sans cette ligne, le
        # serveur démarre normalement mais n'a rien à distribuer.
        extension: ./extension
      args:
        # UID/GID de l'utilisateur du conteneur — alignez-les sur le propriétaire de vos
        # volumes médias (ex: `id -u`/`id -g` de l'utilisateur qui possède le NAS monté).
        PUID: ${PUID:-1000}
        PGID: ${PGID:-1000}
    container_name: ez-dl
    restart: unless-stopped

    # Fichier .env optionnel (non versionné) pour surcharger les variables ci-dessous
    # sans les écrire en clair dans ce fichier. `required: false` : docker compose ne
    # bloque pas si le fichier n'existe pas encore.
    env_file:
      - path: .env
        required: false

    environment:
      # Recommandé : définir EZDL_PASSWORD dans un fichier .env. S'il est absent/vide, le
      # serveur génère un mot de passe fort à CHAQUE démarrage et l'affiche dans les logs
      # (`docker compose logs server`) — il n'existe pas de mode sans authentification.
      EZDL_PASSWORD: "${EZDL_PASSWORD:-}"
      EZDL_HOST: ${EZDL_HOST:-0.0.0.0}
      EZDL_PORT: ${EZDL_PORT:-8000}
      # Racines de téléchargement autorisées, format `Label=/chemin` séparé par des virgules.
      # Exemple cohérent avec les volumes médias montés ci-dessous — à adapter.
      EZDL_DOWNLOAD_ROOTS: ${EZDL_DOWNLOAD_ROOTS:-Movies=/data/movies,Series=/data/series}
      EZDL_DATA_DIR: ${EZDL_DATA_DIR:-/config}
      # Artefacts de l'extension déposés par le build — à ne changer que si l'image est
      # construite autrement.
      EZDL_EXTENSION_DIST_DIR: ${EZDL_EXTENSION_DIST_DIR:-/app/extension-dist}
      EZDL_TEMP_DIR: ${EZDL_TEMP_DIR:-/tmp/ez-dl}
      EZDL_MAX_CONCURRENT_JOBS: ${EZDL_MAX_CONCURRENT_JOBS:-2}
      EZDL_YTDLP_UPDATE_INTERVAL_HOURS: ${EZDL_YTDLP_UPDATE_INTERVAL_HOURS:-24}
      EZDL_YTDLP_BINARY: ${EZDL_YTDLP_BINARY:-yt-dlp}
      EZDL_FFMPEG_BINARY: ${EZDL_FFMPEG_BINARY:-ffmpeg}
      EZDL_CORS_ORIGINS: ${EZDL_CORS_ORIGINS:-chrome-extension://*}
      EZDL_LOG_LEVEL: ${EZDL_LOG_LEVEL:-info}

    ports:
      - "${EZDL_PORT:-8000}:8000"

    volumes:
      # Base SQLite + état applicatif (EZDL_DATA_DIR) — persisté à côté de ce fichier.
      - ./data:/config

      # Fichiers partiels avant déplacement final (EZDL_TEMP_DIR). Volume nommé, donc
      # persistant : c'est ce qui permet de REPRENDRE un téléchargement interrompu par un
      # redémarrage au lieu de le refaire entièrement. Pour repasser en RAM (aucune écriture
      # disque, mais aucune reprise possible et taille limitée par la RAM), remplacer cette
      # ligne par une section `tmpfs: [ "/tmp/ez-dl" ]`.
      - ezdl-temp:/tmp/ez-dl

      # --- Exemples de montages médias à ADAPTER (chemins réels de votre NAS/disque) ---
      # Doivent correspondre aux racines déclarées dans EZDL_DOWNLOAD_ROOTS ci-dessus.
      # - /mnt/media/movies:/data/movies:rw
      # - /mnt/media/series:/data/series:rw

    # Cookie-jars yt-dlp, montés PAR-DESSUS le volume ci-dessus : les cookies transmis par
    # l'extension ne doivent jamais toucher le disque, contrairement aux fichiers partiels.
    tmpfs:
      - /tmp/ez-dl/cookies:mode=1777,size=16m

    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3

volumes:
  # Fichiers partiels des téléchargements en cours (EZDL_TEMP_DIR). Volume nommé et non
  # tmpfs : il survit à `docker compose down`/`up`, ce qui permet de reprendre un
  # téléchargement interrompu plutôt que de le refaire. Purgé au démarrage du serveur de
  # tout ce qui n'est plus reprenable.
  ezdl-temp:
