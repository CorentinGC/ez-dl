# Stack Docker de ez-dl (serveur uniquement — l'extension Chrome n'est pas conteneurisée).
#
# Démarrage :
#   1. Copier ce fichier tel quel ; créer si possible un `.env` à côté avec
#      EZDL_PASSWORD=<mot de passe fort> (sinon un mot de passe est généré à chaque
#      démarrage et affiché dans `docker compose logs`)
#   2. Adapter les volumes médias ci-dessous (chemins réels de votre NAS/disque)
#   3. `docker compose up -d`
#
# GPU NVIDIA (encodage matériel) : voir docker-compose.gpu.yml.

services:
  server:
    # Image publiée par la CI à chaque push sur main (jobs verts uniquement). `docker compose
    # up -d` la tire telle quelle ; `docker compose up -d --build` la reconstruit localement
    # (dev, ou variante GPU).
    image: ${EZDL_IMAGE:-ghcr.io/corentingc/ez-dl:latest}
    build:
      context: ./server
      dockerfile: Dockerfile
      additional_contexts:
        # Sources de l'extension Chrome, buildées en zip pendant la construction de l'image
        # et publiées ensuite sur http://<serveur>:<port>/extension. Sans cette ligne, le
        # serveur démarre normalement mais n'a rien à distribuer.
        extension: ./extension
      args:
        # Valeurs de départ de l'utilisateur créé DANS l'image. Ce ne sont plus elles qui
        # décident de l'identité d'exécution : l'entrypoint applique les variables
        # d'environnement PUID/PGID ci-dessous au démarrage du conteneur.
        PUID: ${PUID:-1000}
        PGID: ${PGID:-1000}
    container_name: ez-dl
    restart: unless-stopped

    # Garde-fous contre les process yt-dlp/ffmpeg fantômes : `init` fait de tini le PID 1
    # (récolte des orphelins), `mem_limit` et `pids_limit` bornent les dégâts d'une
    # extraction qui s'emballe plutôt que de laisser l'OOM-killer choisir pour tout l'hôte.
    init: true
    mem_limit: ${EZDL_MEM_LIMIT:-4g}
    pids_limit: 512

    # Opt-in du service `watchtower` ci-dessous : seuls les conteneurs portant ces labels
    # (et ce scope) sont mis à jour — les autres stacks de l'hôte ne sont jamais touchées.
    labels:
      - com.centurylinklabs.watchtower.enable=true
      - com.centurylinklabs.watchtower.scope=ez-dl

    # Fichier .env optionnel (non versionné) pour surcharger les variables ci-dessous
    # sans les écrire en clair dans ce fichier. `required: false` : docker compose ne
    # bloque pas si le fichier n'existe pas encore.
    env_file:
      - path: .env
        required: false

    environment:
      # UID/GID d'exécution du serveur — alignez-les sur le PROPRIÉTAIRE de vos volumes
      # médias (`id -u` / `id -g` sur l'hôte, ou le propriétaire du partage sur un NAS).
      # Appliqués au démarrage du conteneur par l'entrypoint : l'image publiée fonctionne
      # telle quelle sur un hôte dont l'utilisateur n'est pas 1000, sans reconstruction.
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}

      # Recommandé : définir EZDL_PASSWORD dans un fichier .env. S'il est absent/vide, le
      # serveur génère un mot de passe fort à CHAQUE démarrage et l'affiche dans les logs
      # (`docker compose logs server`) — il n'existe pas de mode sans authentification.
      EZDL_PASSWORD: "${EZDL_PASSWORD:-}"
      EZDL_HOST: ${EZDL_HOST:-0.0.0.0}
      EZDL_PORT: ${EZDL_PORT:-8000}
      # Racines de téléchargement autorisées, format `Label=/chemin` séparé par des virgules.
      # Exemple cohérent avec les volumes médias montés ci-dessous — à adapter.
      EZDL_DOWNLOAD_ROOTS: ${EZDL_DOWNLOAD_ROOTS:-Movies=/data/movies,Series=/data/series}
      EZDL_DATA_DIR: ${EZDL_DATA_DIR:-/config}
      # Artefacts de l'extension déposés par le build — à ne changer que si l'image est
      # construite autrement.
      EZDL_EXTENSION_DIST_DIR: ${EZDL_EXTENSION_DIST_DIR:-/app/extension-dist}
      # URL publique du serveur — utile seulement derrière un reverse proxy, où
      # /extension/update.xml doit publier une adresse que le poste client sait joindre.
      EZDL_PUBLIC_URL: ${EZDL_PUBLIC_URL:-}
      EZDL_TEMP_DIR: ${EZDL_TEMP_DIR:-/tmp/ez-dl}
      EZDL_MAX_CONCURRENT_JOBS: ${EZDL_MAX_CONCURRENT_JOBS:-2}
      EZDL_YTDLP_UPDATE_INTERVAL_HOURS: ${EZDL_YTDLP_UPDATE_INTERVAL_HOURS:-24}
      EZDL_YTDLP_BINARY: ${EZDL_YTDLP_BINARY:-yt-dlp}
      EZDL_FFMPEG_BINARY: ${EZDL_FFMPEG_BINARY:-ffmpeg}
      EZDL_CORS_ORIGINS: ${EZDL_CORS_ORIGINS:-chrome-extension://*}
      EZDL_LOG_LEVEL: ${EZDL_LOG_LEVEL:-info}
      # Proxy sortant pour yt-dlp (vide = connexion directe), ex. `http://gluetun:8888`
      # ou `socks5h://gluetun:1080`. Peut contenir des identifiants : jamais loggé.
      EZDL_PROXY: ${EZDL_PROXY:-}
      # Durée maximale (secondes) d'une analyse d'URL avant que yt-dlp ne soit tué.
      EZDL_PROBE_TIMEOUT_SECONDS: ${EZDL_PROBE_TIMEOUT_SECONDS:-25}

    ports:
      - "${EZDL_PORT:-8000}:8000"

    volumes:
      # Base SQLite + état applicatif (EZDL_DATA_DIR) — persisté à côté de ce fichier.
      - ./data:/config

      # Fichiers partiels avant déplacement final (EZDL_TEMP_DIR). Volume nommé, donc
      # persistant : c'est ce qui permet de REPRENDRE un téléchargement interrompu par un
      # redémarrage au lieu de le refaire entièrement. Pour repasser en RAM (aucune écriture
      # disque, mais aucune reprise possible et taille limitée par la RAM), remplacer cette
      # ligne par une section `tmpfs: [ "/tmp/ez-dl" ]`.
      - ezdl-temp:/tmp/ez-dl

      # --- Exemples de montages médias à ADAPTER (chemins réels de votre NAS/disque) ---
      # Doivent correspondre aux racines déclarées dans EZDL_DOWNLOAD_ROOTS ci-dessus.
      # - /mnt/media/movies:/data/movies:rw
      # - /mnt/media/series:/data/series:rw

    # Cookie-jars yt-dlp, montés PAR-DESSUS le volume ci-dessus : les cookies transmis par
    # l'extension ne doivent jamais toucher le disque, contrairement aux fichiers partiels.
    tmpfs:
      - /tmp/ez-dl/cookies:mode=1777,size=16m

    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3

  # Mise à jour automatique du serveur, intégrée au stack : watchtower tire la nouvelle
  # image GHCR dès que la CI en publie une, puis recrée le conteneur `server` à l'identique.
  # Opt-in : ajouter `COMPOSE_PROFILES=autoupdate` dans le .env (le service ne démarre pas
  # sans ce profil). Ne fonctionne qu'avec l'image publiée — un serveur buildé localement
  # serait « rétrogradé » vers l'image du registre à la première vérification.
  watchtower:
    image: containrrr/watchtower:1.7.1
    container_name: ez-dl-watchtower
    profiles: ["autoupdate"]
    restart: unless-stopped
    volumes:
      # Nécessaire pour recréer le conteneur — c'est un accès root à Docker : le service
      # n'expose aucun port et ne surveille que les conteneurs du scope `ez-dl`.
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      WATCHTOWER_LABEL_ENABLE: "true"
      WATCHTOWER_SCOPE: ez-dl
      # Période de vérification du registre, en secondes.
      WATCHTOWER_POLL_INTERVAL: ${EZDL_AUTO_UPDATE_INTERVAL_SECONDS:-300}
      # Supprime l'ancienne image après mise à jour (sinon elles s'accumulent).
      WATCHTOWER_CLEANUP: "true"
    labels:
      # watchtower doit porter son propre scope pour que `WATCHTOWER_SCOPE` filtre.
      - com.centurylinklabs.watchtower.scope=ez-dl

volumes:
  # Fichiers partiels des téléchargements en cours (EZDL_TEMP_DIR). Volume nommé et non
  # tmpfs : il survit à `docker compose down`/`up`, ce qui permet de reprendre un
  # téléchargement interrompu plutôt que de le refaire. Purgé au démarrage du serveur de
  # tout ce qui n'est plus reprenable.
  ezdl-temp:
